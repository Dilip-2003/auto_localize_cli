name: auto_localize_cli
description: AST-powered Flutter CLI that extracts hardcoded strings into .arb files, removes ancestor consts, and rewrites code to use context-less l10n getters.
version: 1.1.1
homepage: https://github.com/Dilip-2003/auto_localize_cli
repository: https://github.com/Dilip-2003/auto_localize_cli
issue_tracker: https://github.com/Dilip-2003/auto_localize_cli/issues
topics:
  - flutter
  - localization
  - l10n
  - i18n
  - cli

environment:
  sdk: ^3.0.0

dependencies:
  analyzer: '>=6.4.0 <15.0.0'
  args: ^2.5.0
  path: ^1.9.0
  yaml: ^3.1.2
  yaml_edit: ^2.2.0

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  test: ^1.25.0

executables:
  auto_localize_cli: auto_localize_cli
