name: auto_localize_cli
description: ⚡ Zero-config AST-powered Flutter CLI that automatically extracts hardcoded strings & interpolations into .arb files, generates smart camelCase keys, removes ancestor const modifiers, and rewrites source code to use a context-less, compile-safe l10n getter.
version: 1.0.0
homepage: https://github.com/Dilip-2003/auto_localize_cli
repository: https://github.com/Dilip-2003/auto_localize_cli
issue_tracker: https://github.com/Dilip-2003/auto_localize_cli/issues
topics:
  - flutter
  - localization
  - l10n
  - i18n
  - cli

environment:
  sdk: ^3.0.0

dependencies:
  analyzer: ^6.4.0
  args: ^2.5.0
  path: ^1.9.0
  yaml: ^3.1.2
  yaml_edit: ^2.2.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.25.0

executables:
  init: init
  extract: extract
